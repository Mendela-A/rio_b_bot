services:
  postgres:
    image: postgres:16
    container_name: rio_postgres
    environment:
      POSTGRES_DB: rio
      POSTGRES_USER: rio_user
      POSTGRES_PASSWORD: rio_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rio_user -d rio"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: rio_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rio.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    image: postgres:16
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: rio
      DB_USER: rio_user
      DB_PASSWORD: rio_pass
    volumes:
      - ./migrations:/migrations:ro
      - ./docker-migrate.sh:/docker-migrate.sh:ro
    command: ["bash", "/docker-migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    container_name: rio_bot
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  admin:
    build: ./admin
    container_name: rio_admin
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  uploads_data:
